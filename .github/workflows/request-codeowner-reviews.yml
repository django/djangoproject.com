# CODEOWNERS only applies to teams with write access, so request reviews
# from the matching teams explicitly (that only needs read access).
name: Request codeowner reviews

on:
    pull_request_target:
        types: [opened, ready_for_review]

permissions:
    contents: read
    pull-requests: write

jobs:
    request-reviews:
        if: ${{ !github.event.pull_request.draft }}
        runs-on: ubuntu-24.04
        env:
            GH_TOKEN: ${{ github.token }}
            GH_REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}
        steps:
            # Never checks out or runs PR code: CODEOWNERS is read from the base branch.
            - shell: python
              run: |
                  import json
                  import os
                  from fnmatch import fnmatch
                  from urllib.request import Request, urlopen

                  REPO = os.environ["GH_REPO"]
                  PR = os.environ["PR"]

                  def github(path, data=None, accept="application/vnd.github+json"):
                      request = Request(
                          f"https://api.github.com/repos/{REPO}/{path}",
                          data=json.dumps(data).encode() if data else None,
                          headers={
                              "Accept": accept,
                              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                          },
                      )
                      with urlopen(request) as response:
                          body = response.read()
                      return body.decode() if accept.endswith(".raw") else json.loads(body)


                  codeowners = github(
                      "contents/.github/CODEOWNERS", accept="application/vnd.github.raw"
                  )

                  files = []
                  page = 1
                  while batch := github(f"pulls/{PR}/files?per_page=100&page={page}"):
                      files += [f["filename"] for f in batch]
                      page += 1

                  teams = set()
                  for line in codeowners.splitlines():
                      if not line.strip() or line.startswith("#"):
                          continue
                      pattern, *owners = line.split()
                      # "dir/**/*" -> "dir/*" (fnmatch's * also matches "/")
                      pattern = pattern.replace("/**/", "/")
                      if any(fnmatch(f, pattern) for f in files):
                          teams.update(owner.removeprefix("@django/") for owner in owners)

                  print(f"Requesting reviews from: {', '.join(sorted(teams)) or 'nobody'}")
                  if teams:
                      github(
                          f"pulls/{PR}/requested_reviewers",
                          data={"team_reviewers": sorted(teams)},
                      )
