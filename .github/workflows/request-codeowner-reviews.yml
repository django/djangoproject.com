# CODEOWNERS only applies to teams with write access, so request reviews
# from the matching teams explicitly (that only needs read access).
#
# GITHUB_TOKEN can't see org teams, so this needs a CODEOWNERS_TOKEN secret:
# a fine-grained PAT with "Pull requests: read and write" on this repository
# and "Members: read" on the organization.
name: Request codeowner reviews

on:
    pull_request_target:
        types: [opened, ready_for_review]

permissions:
    contents: read

jobs:
    request-reviews:
        if: ${{ !github.event.pull_request.draft }}
        runs-on: ubuntu-24.04
        steps:
            # pull_request_target checks out the base branch, never the PR's code.
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - run: python .github/workflows/request-codeowner-reviews.py "$PR"
              env:
                  GITHUB_TOKEN: ${{ secrets.CODEOWNERS_TOKEN }}
                  PR: ${{ github.event.pull_request.number }}
