---
name: Tests on Django main

on:
    pull_request:
        paths:
            - ".github/workflows/django-main.yml"
            - "djangoproject/static/css/lib/**"
            - "djangoproject/static/js/lib/**"
    schedule:
        - cron: "0 0 * * *"
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    PYTHON_VERSION: 3.12

jobs:
    tests:
        runs-on: ubuntu-24.04

        services:
            postgres:
                image: postgres:17-trixie
                env:
                    POSTGRES_PASSWORD: postgres
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5
                ports:
                    - 5432:5432

        steps:
            - uses: actions/checkout@v7.0.1
            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: ${{ env.PYTHON_VERSION }}
            - name: Install gettext
              run: sudo apt-get update && sudo apt-get install -y gettext
            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip setuptools
                  python -m pip install -r requirements/tests.txt
                  python -m pip install --upgrade --force-reinstall \
                            "Django @ git+https://github.com/django/django.git@main"
            - name: Install playwright browsers
              run: |
                  python -m playwright install --with-deps chromium
            - name: Set up databases
              run: |
                  PGPASSWORD="postgres" createuser -U postgres -d djangoproject --superuser -h localhost
                  PGPASSWORD="postgres" createdb -U postgres -O djangoproject djangoproject -h localhost
                  PGPASSWORD="postgres" createuser -U postgres -d code.djangoproject --superuser -h localhost
                  PGPASSWORD="postgres" createdb -U postgres -O code.djangoproject code.djangoproject -h localhost
                  PGPASSWORD="postgres" psql -U postgres -h localhost -c "ALTER USER djangoproject WITH PASSWORD 'secret';"
                  PGPASSWORD="postgres" psql -U postgres -h localhost -c "ALTER USER \"code.djangoproject\" WITH PASSWORD 'secret';"
            - name: Load Trac data
              run: |
                  PGPASSWORD="postgres" psql -U postgres -d code.djangoproject -h localhost < tracdb/trac.sql
            - name: Create secrets.json
              working-directory: ..
              run: |
                  mkdir conf
                  echo '{"db_host": "localhost", ' > conf/secrets.json
                  echo '"db_password": "secret", ' >> conf/secrets.json
                  echo '"trac_db_host": "localhost", ' >> conf/secrets.json
                  echo '"trac_db_password": "secret", ' >> conf/secrets.json
                  echo '"secret_key": "a"}' >> conf/secrets.json

            - name: Run tests
              env:
                  PYTHONWARNINGS: default
              run: |
                  make ci

    check-vendored-drift:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1
              with:
                  persist-credentials: false
            - name: Check equality of vendored console-tabs.css
              env:
                  # First line past license comment added in vendoring.
                  VENDORED_START_LINE: 5
              run: |
                  curl -fsS -o upstream.css \
                      https://raw.githubusercontent.com/django/django/main/docs/_static/console-tabs.css
                  if ! tail -n "+$VENDORED_START_LINE" djangoproject/static/css/lib/console-tabs.css \
                         | diff -u upstream.css -; then
                      echo "::error::console-tabs.css has drifted from django/django:main; re-vendor it."
                      exit 1
                  fi
