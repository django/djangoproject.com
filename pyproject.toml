[project]
name = "djangoproject-com"
version = "0.0.1"
description = "Source code to djangoproject.com"
requires-python = "==3.12.*"
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "babel==2.18.0",
    "django==6.1",
    "django-admin-dracula==0.0.3",
    "django-contact-form==5.2.0",
    "django-countries==9.0.0",
    "django-hosts==7.0.0",
    "django-money==3.6.1",
    "django-push @ git+https://github.com/brutasse/django-push.git@22fda99641cfbd2f3075a723d92652a8e38220a5",
    "django-read-only==1.21.0",
    "django-recaptcha==4.1.0",
    "django-registration-redux==2.13",
    "docutils==0.21.2",
    "feedparser==6.0.14",
    "jinja2==3.1.6",
    "libsass==0.23.0",
    "markdown==3.10.2",
    "pillow==12.3.0",
    "pygments==2.20.0",
    "pykismet3==0.1.1",
    "pymdown-extensions==11.0.1",
    "python-dateutil==2.9.0.post0",
    "requests==2.34.2",
    "sorl-thumbnail==12.11.0",
    "sphinx==8.1.3",
    "stripe==13.2.0",
    "time-machine==3.3.0",
]

[dependency-groups]
dev = [
    "black==26.5.1",               # Used by Django's find_formatters and run_formatters
    "django-debug-toolbar==7.0.0",
    "prek==0.4.11",
    "psycopg[binary]==3.3.4",
    "watchdog==6.0.0",
]
prod = [
    "gunicorn==26.0.0",
    "psycopg[c]==3.3.4",
    "redis==8.1.0",
    "sentry-sdk==2.66.1",
]
# TODO: Consider merging with dev group
tests = [
    "coverage==7.15.2",
    "playwright==1.62.0",
    "requests-mock==1.12.1",
    "tblib==3.2.2",
    { include-group = "dev" },
]

[tool.uv]
# The earliest version that supports the current lock file revision (3)
required-version = ">=0.8.4"
package = false
